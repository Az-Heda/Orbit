[package]
name = "orbit"
version = "1.1.1"
description = "Orbit: local-first productivity app"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.29.3", features = ["v4"] }
thiserror = "2.0.21"
anyhow = "1.0.105"
async-trait = "0.1.92"
tracing = "0.1.44"
chrono = "0.4.45"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rrule = "0.14.0"
chrono-tz = "0.10.4"
icalendar = { version = "0.17.17", features = ["parser"] }
tauri-plugin-dialog = "2.8.4"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
semver = "1.0.28"
sha2 = "0.11.1"
minisign-verify = "0.3.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[target."cfg(windows)".dependencies]
keyring-core = "1.1.0"
windows-native-keyring-store = "1.1.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
